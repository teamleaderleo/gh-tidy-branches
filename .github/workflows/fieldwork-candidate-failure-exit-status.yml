name: Fieldwork candidate failure exit status

on:
  pull_request:
    branches:
      - fix/reconcile-partial-restore-receipt
    paths:
      - .github/fieldwork/materialize-candidate-failure-exit-status.py
      - .github/workflows/fieldwork-candidate-failure-exit-status.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldwork-candidate-failure-exit-status
  cancel-in-progress: true

env:
  BASE_SHA: 6b949144af52895d58759b181c8a18ebc4bab1a7

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify exact stacked base
        run: test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"

      - name: Materialize candidate failure settlement
        run: python3 .github/fieldwork/materialize-candidate-failure-exit-status.py

      - name: Format source and tests
        run: gofmt -w internal/app/app.go internal/app/undo.go internal/app/candidate_failure_outcome_test.go

      - name: Run complete tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Publish source-only candidate
        run: |
          rm .github/fieldwork/materialize-candidate-failure-exit-status.py
          rm .github/workflows/fieldwork-candidate-failure-exit-status.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only "$BASE_SHA" | sort)
          printf 'changed files:\n%s\n' "${changed[*]}"
          expected=(
            internal/app/app.go
            internal/app/candidate_failure_outcome_test.go
            internal/app/undo.go
          )
          test "${changed[*]}" = "${expected[*]}"
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(app): fail command when candidate mutations fail'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
