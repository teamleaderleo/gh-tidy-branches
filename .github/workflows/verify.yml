name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -w .
      - run: git diff --exit-code
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build and smoke test
        run: |
          mkdir -p dist
          go build -trimpath -ldflags=-X=main.version=ci -o dist/gh-tidy-branches ./cmd/gh-tidy-branches
          test "$(./dist/gh-tidy-branches --version)" = "ci"
          help="$(./dist/gh-tidy-branches --help)"
          grep -F -- '--preview' <<<"$help"
          grep -F -- '-R, --repo REPO' <<<"$help"
          grep -F -- 'gh tidy-branches undo' <<<"$help"
          grep -F -- 'gh tidy-branches doctor [owner/repo ...]' <<<"$help"

  extension-install:
    name: local extension install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build root extension executable
        run: make build VERSION=ci-extension
      - name: Install through GitHub CLI and verify command surface
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/gh-config
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: |
          gh --version
          gh extension install .
          test "$(gh tidy-branches --version)" = "ci-extension"
          help="$(gh tidy-branches --help)"
          grep -F -- '--preview' <<<"$help"
          grep -F -- '-R, --repo REPO' <<<"$help"
          grep -F -- 'gh tidy-branches undo' <<<"$help"
          grep -F -- 'gh tidy-branches doctor [owner/repo ...]' <<<"$help"
          gh extension remove tidy-branches

  cross-build:
    name: cross-build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          output="dist/gh-tidy-branches_${GOOS}-${GOARCH}${{ matrix.extension }}"
          go build -trimpath -ldflags=-X=main.version=ci -o "$output" ./cmd/gh-tidy-branches
          test -f "$output"
