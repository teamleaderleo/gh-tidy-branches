name: Fieldwork mutation failure exit repair

on:
  push:
    branches:
      - fix/mutation-failure-exit-status

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mutation-failure-exit-status
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply bounded repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('internal/app/app.go')
          text = app.read_text()
          old = '''\toutput.ElapsedMilliseconds = time.Since(started).Milliseconds()

\tif options.JSON {
\t\tif err := writeJSON(stdout, output); err != nil {
\t\t\treturn err
\t\t}
\t\treturn errorIfRepositoryFailures(repositoryErrors)
\t}
\tprintApplyResults(stdout, applied)
'''
          new = '''\toutput.ElapsedMilliseconds = time.Since(started).Milliseconds()
\tapplyErr := applyResultError(applied)

\tif options.JSON {
\t\tif err := writeJSON(stdout, output); err != nil {
\t\t\treturn err
\t\t}
\t\treturn errors.Join(errorIfRepositoryFailures(repositoryErrors), applyErr)
\t}
\tprintApplyResults(stdout, applied)
'''
          if old not in text:
              raise SystemExit('app output anchor not found')
          text = text.replace(old, new, 1)
          old = '''\treturn errorIfRepositoryFailures(repositoryErrors)
}

func parse(args []string) (Options, error) {'''
          new = '''\treturn errors.Join(errorIfRepositoryFailures(repositoryErrors), applyErr)
}

func parse(args []string) (Options, error) {'''
          if old not in text:
              raise SystemExit('app final return anchor not found')
          text = text.replace(old, new, 1)
          old = '''func errorIfRepositoryFailures(repositoryErrors []RepositoryError) error {
'''
          new = '''func applyResultError(results []scan.ApplyResult) error {
\tfailed := 0
\tfor _, result := range results {
\t\tif result.Status == scan.StatusFailed {
\t\t\tfailed++
\t\t}
\t}
\tif failed == 0 {
\t\treturn nil
\t}
\treturn fmt.Errorf("%d branch deletion(s) failed", failed)
}

func errorIfRepositoryFailures(repositoryErrors []RepositoryError) error {
'''
          if old not in text:
              raise SystemExit('app helper anchor not found')
          app.write_text(text.replace(old, new, 1))

          undo = Path('internal/app/undo.go')
          text = undo.read_text()
          old = '''\tif err := errors.Join(restoreErr, receiptErr); err != nil {
\t\treturn err
\t}
\toutput := UndoOutput{SchemaVersion: "tidy-branches.undo-result.v1", Receipt: path, Results: results, RequestStats: client.SnapshotStats()}
\tif jsonOutput {
\t\treturn writeJSON(stdout, output)
\t}
'''
          new = '''\tterminalErr := errors.Join(restoreErr, receiptErr)
\tresultErr := restoreResultError(results)
\tif terminalErr != nil {
\t\treturn errors.Join(terminalErr, resultErr)
\t}
\toutput := UndoOutput{SchemaVersion: "tidy-branches.undo-result.v1", Receipt: path, Results: results, RequestStats: client.SnapshotStats()}
\tif jsonOutput {
\t\tif err := writeJSON(stdout, output); err != nil {
\t\t\treturn err
\t\t}
\t\treturn resultErr
\t}
'''
          if old not in text:
              raise SystemExit('undo output anchor not found')
          text = text.replace(old, new, 1)
          old = '''\treturn nil
}

func parseUndo(args []string) (bool, bool, error) {'''
          new = '''\treturn resultErr
}

func parseUndo(args []string) (bool, bool, error) {'''
          if old not in text:
              raise SystemExit('undo final return anchor not found')
          text = text.replace(old, new, 1)
          old = '''func remainingReceiptEntries(entries []receipt.Entry, results []scan.RestoreResult) []receipt.Entry {
'''
          new = '''func restoreResultError(results []scan.RestoreResult) error {
\tfailed := 0
\tfor _, result := range results {
\t\tif result.Status == scan.StatusRestoreFailed {
\t\t\tfailed++
\t\t}
\t}
\tif failed == 0 {
\t\treturn nil
\t}
\treturn fmt.Errorf("%d branch restoration(s) failed", failed)
}

func remainingReceiptEntries(entries []receipt.Entry, results []scan.RestoreResult) []receipt.Entry {
'''
          if old not in text:
              raise SystemExit('undo helper anchor not found')
          undo.write_text(text.replace(old, new, 1))

          Path('internal/app/mutation_failure_status_test.go').write_text('''package app

import (
\t"testing"

\t"github.com/teamleaderleo/gh-tidy-branches/internal/scan"
)

func TestApplyResultErrorOnlyFailsForFailedMutations(t *testing.T) {
\tif err := applyResultError([]scan.ApplyResult{{Status: scan.StatusDeleted}, {Status: scan.StatusSkipped}}); err != nil {
\t\tt.Fatalf("safe apply results returned an error: %v", err)
\t}
\tif err := applyResultError([]scan.ApplyResult{{Status: scan.StatusDeleted}, {Status: scan.StatusFailed}}); err == nil {
\t\tt.Fatal("failed deletion returned success")
\t}
}

func TestRestoreResultErrorOnlyFailsForFailedMutations(t *testing.T) {
\tif err := restoreResultError([]scan.RestoreResult{{Status: scan.StatusRestored}, {Status: scan.StatusAlreadyPresent}, {Status: scan.StatusRestoreSkipped}}); err != nil {
\t\tt.Fatalf("safe restore results returned an error: %v", err)
\t}
\tif err := restoreResultError([]scan.RestoreResult{{Status: scan.StatusRestored}, {Status: scan.StatusRestoreFailed}}); err == nil {
\t\tt.Fatal("failed restoration returned success")
\t}
}
''')
          PY
          gofmt -w internal/app/app.go internal/app/undo.go internal/app/mutation_failure_status_test.go
      - run: go test ./...
      - name: Publish clean source result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fieldwork-mutation-failure-exit.yml
          git add internal/app/app.go internal/app/undo.go internal/app/mutation_failure_status_test.go
          git commit -m "fix(app): fail on candidate mutation errors"
          git push origin HEAD:fix/mutation-failure-exit-status
